# goreleaser config for scribe.
#
# CGO is required because scribe depends on go-sqlite3 with the FTS5 build
# tag. The release runs on an Apple Silicon macOS runner: Apple's native
# toolchain builds both Darwin architectures, while pinned Zig cross-compilers
# build both Linux architectures. Darwin binaries are then signed and
# notarized with Apple's native tools before GoReleaser archives them.
#
# Publish (see the release workflow for required tools and credentials):
#   goreleaser release --clean
#
# Dry-run locally on Apple Silicon with Zig installed (no publish; explicitly
# opt out of Apple signing because release signing is fail-closed by default):
#   SCRIBE_SKIP_APPLE_SIGNING=1 goreleaser release --snapshot --clean \
#     --skip=publish,sign,sbom

version: 2

project_name: scribe

before:
  hooks:
    - go mod tidy

builds:
  - id: scribe
    main: ./cmd/scribe
    binary: scribe
    env:
      - CGO_ENABLED=1
    flags:
      - -tags=sqlite_fts5
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    # Per-target compiler selection. The deployment flags prevent builds made
    # with a new macOS SDK from accidentally requiring that new macOS version.
    # Zig's explicit glibc 2.17 target keeps the Linux artifacts compatible
    # with older distributions while still supporting CGO.
    overrides:
      - goos: darwin
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=clang
          - CXX=clang++
          - MACOSX_DEPLOYMENT_TARGET=12.0
          - CGO_CFLAGS=-mmacosx-version-min=12.0
          - CGO_LDFLAGS=-mmacosx-version-min=12.0
      - goos: darwin
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=clang
          - CXX=clang++
          - MACOSX_DEPLOYMENT_TARGET=12.0
          - CGO_CFLAGS=-mmacosx-version-min=12.0
          - CGO_LDFLAGS=-mmacosx-version-min=12.0
      - goos: linux
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=zig cc -target x86_64-linux-gnu.2.17
          - CXX=zig c++ -target x86_64-linux-gnu.2.17
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=zig cc -target aarch64-linux-gnu.2.17
          - CXX=zig c++ -target aarch64-linux-gnu.2.17
    # These hooks run before archives, SBOMs, checksums, and publication. The
    # script is a no-op for Linux and fails closed for Darwin unless the caller
    # explicitly sets SCRIBE_SKIP_APPLE_SIGNING=1 for a local snapshot.
    hooks:
      post:
        - cmd: ./scripts/sign-notarize-darwin.sh "{{ .Path }}" "{{ .Target }}" "{{ .Os }}" "{{ .Arch }}"
          output: true

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE*
      - install.sh

checksum:
  name_template: "checksums.txt"

# SBOM per release archive via syft. The release workflow installs a pinned,
# checksum-verified syft binary before invoking GoReleaser.
sboms:
  - artifacts: archive

# Keyless (OIDC) cosign signature over checksums.txt — one signature
# covers every artifact transitively, since the checksum file pins them
# all. Needs `id-token: write` plus the ACTIONS_ID_TOKEN_* env
# passthrough in the release workflow. Verify a download with:
#   cosign verify-blob \
#     --certificate checksums.txt.pem --signature checksums.txt.sig \
#     --certificate-identity-regexp 'github.com/oliver-kriska/scribe' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    signature: "${artifact}.sig"
    args:
      - sign-blob
      - --output-certificate=${certificate}
      - --output-signature=${signature}
      - --yes
      - ${artifact}
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: scribe
    repository:
      owner: oliver-kriska
      name: homebrew-scribe
      # Without this, goreleaser uses the workflow's GITHUB_TOKEN which is
      # scoped only to the scribe repo and gets 403 on the tap.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    homepage: "https://github.com/oliver-kriska/scribe"
    description: "LLM-managed personal knowledge base tooling"
    license: MIT
    dependencies:
      - name: git
      - name: sqlite
      # Tap-qualified name: goreleaser renders this as
      #   depends_on "neilberkman/tap/ccrider"
      # so `brew install oliver-kriska/scribe/scribe` auto-taps neilberkman's
      # tap and pulls ccrider too. Honza's install hit a [FAIL] wall on
      # ccrider before this was declared.
      - name: neilberkman/tap/ccrider
    caveats: |
      Runtime dependencies not on Homebrew — install these separately:
        * claude     (Claude Code CLI)
                     curl -fsSL https://claude.ai/install.sh | bash
        * qmd        (semantic search over the KB)
                     npm install -g @tobilu/qmd
        * trafilatura (optional, URL → markdown)
                     pipx install trafilatura
        * jq, fzf    (optional)
                     brew install jq fzf

      Already installed by brew as dependencies: git, sqlite, ccrider.

      After installing:
        scribe init --path ~/my-kb --bind
        cd ~/my-kb && scribe skill install
        scribe cron install           # macOS: LaunchAgents
                                      # Linux: prints crontab lines
        scribe doctor

      Personal, Ollama, hosted, and team recipes: https://getscribe.dev/setup.md

      macOS — Full Disk Access for `scribe capture` (iMessage):
        scribe fda                    # opens the FDA pane and walks you through
                                      # drag-and-drop from Finder is the most
                                      # reliable method on macOS 14+

      macOS release binaries are Developer ID signed, so in-place replacements
      keep a stable code identity. Homebrew also changes the raw executable's
      versioned Cellar path, which TCC records separately; after
      `brew upgrade scribe`, run `scribe fda` to verify and re-grant if needed.

      Upgrades already run `scribe cron install --if-installed` for you
      (see below), so any new or changed scheduled job lands automatically
      if you'd previously opted into cron — no manual step needed unless
      you hand-edited a plist yourself, in which case adopt it back with
      `scribe cron install --force`.
    install: |
      bin.install "scribe"
    # custom_block is injected verbatim into the generated Formula. The
    # post_install hook runs on every install and upgrade so scheduled jobs
    # self-heal when a release changes the LaunchAgent set.
    custom_block: |
      def post_install
        return unless OS.mac?
        ohai "Homebrew upgraded scribe."
        ohai "If you use iMessage capture, run `scribe fda` to verify that the"
        ohai "new versioned Cellar path has Full Disk Access."

        # Self-heal already-installed LaunchAgents so a changed job set in
        # this release (e.g. v0.4.0 adding dream-hot) lands without a
        # manual `scribe cron install`. --if-installed is a silent no-op
        # on fresh installs (no plists yet — see cmd/scribe/cron.go) and
        # only rewrites plists it can prove it authored itself. Homebrew's
        # `system` raises on a nonzero exit, and a cron/launchctl hiccup
        # here must never abort the brew install — rescue and warn instead.
        begin
          system bin/"scribe", "cron", "install", "--if-installed"
        rescue => e
          opoo "scribe cron install --if-installed failed: #{e.message} (run it manually)"
        end
      end
    test: |
      assert_match "scribe", shell_output("#{bin}/scribe --help 2>&1")
