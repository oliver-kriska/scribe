# Release pipeline for scribe.
#
# Runs GoReleaser under the goreleaser-cross docker image, which ships the
# C toolchains for darwin amd64/arm64 and linux amd64/arm64 needed because
# scribe links go-sqlite3 (CGO + sqlite_fts5 build tag). Cross-compiling
# CGO from a single host otherwise fails at the linker.
#
# Triggered on tag push. Requires:
#   - HOMEBREW_TAP_GITHUB_TOKEN repo secret (PAT with repo:write on
#     oliver-kriska/homebrew-scribe)  — used by goreleaser to publish the
#     formula update.
#   - MACOS_SIGN_P12 + MACOS_SIGN_PASSWORD (Developer ID Application
#     certificate exported as base64 PKCS#12 and its password).
#   - MACOS_NOTARY_KEY + MACOS_NOTARY_KEY_ID + MACOS_NOTARY_ISSUER_ID
#     (base64 App Store Connect API key and its identifiers).

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # Manual trigger to backfill a release for an existing tag when the
    # automatic push trigger was suppressed (e.g. >3 tags pushed at once).
    # Run from main with the tag as input:
    #   gh workflow run release.yml --ref main -f tag=vX.Y.Z
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.7)"
        required: true

# Read-only at the top level (Scorecard Token-Permissions). The write
# scopes below are granted only to the one job that needs them.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # GoReleaser creates the GitHub release and uploads the artifacts.
      contents: write
      # Keyless cosign signing: the OIDC token proves this workflow (not a
      # stolen key) produced the signature on checksums.txt.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # goreleaser-cross bundles cosign but NOT syft. Install a pinned,
      # checksum-verified syft on the runner and mount it into the
      # container (static Go binary — runs fine in the debian image).
      - name: Install syft v1.51.0 (SBOM generation)
        run: |
          curl -sSfLO https://github.com/anchore/syft/releases/download/v1.51.0/syft_1.51.0_linux_amd64.tar.gz
          curl -sSfLO https://github.com/anchore/syft/releases/download/v1.51.0/syft_1.51.0_checksums.txt
          grep ' syft_1.51.0_linux_amd64.tar.gz$' syft_1.51.0_checksums.txt | sha256sum -c -
          tar -xzf syft_1.51.0_linux_amd64.tar.gz syft
          sudo install syft /usr/local/bin/syft
          rm -f syft syft_1.51.0_linux_amd64.tar.gz syft_1.51.0_checksums.txt

      # Never silently publish unsigned macOS artifacts. The notarize block in
      # .goreleaser.yml is conditionally disabled for local snapshots, so the
      # release workflow must enforce that every production credential exists.
      - name: Require Apple signing credentials
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          missing=()
          for name in \
            MACOS_SIGN_P12 \
            MACOS_SIGN_PASSWORD \
            MACOS_NOTARY_KEY \
            MACOS_NOTARY_KEY_ID \
            MACOS_NOTARY_ISSUER_ID
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required repository secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Run GoReleaser in cross-compile container
        # Image contains Go 1.26.5 + GoReleaser 2.17.1. Do not downgrade to
        # 2.17.0: its Quill wait loop polls Apple's notarization API every 10ns
        # instead of 10s and can fail releases with RATE_LIMIT responses.
        #
        # Image pinned by DIGEST (= tag v1.26.5-v2.17.1): this container runs
        # with the Homebrew-tap PAT in its env, so a repointed tag would
        # be a formula-compromise vector. To bump, resolve the new tag:
        #   TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:goreleaser/goreleaser-cross:pull" | jq -r .token)
        #   curl -sI -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.oci.image.index.v1+json" \
        #     https://ghcr.io/v2/goreleaser/goreleaser-cross/manifests/<TAG> | grep -i docker-content-digest
        run: |
          docker run --rm \
            -v "$PWD":/go/src/github.com/oliver-kriska/scribe \
            -v /usr/local/bin/syft:/usr/local/bin/syft:ro \
            -w /go/src/github.com/oliver-kriska/scribe \
            -e GITHUB_TOKEN \
            -e HOMEBREW_TAP_GITHUB_TOKEN \
            -e ACTIONS_ID_TOKEN_REQUEST_URL \
            -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -e MACOS_SIGN_P12 \
            -e MACOS_SIGN_PASSWORD \
            -e MACOS_NOTARY_KEY \
            -e MACOS_NOTARY_KEY_ID \
            -e MACOS_NOTARY_ISSUER_ID \
            ghcr.io/goreleaser/goreleaser-cross@sha256:0cf2b7f757b40397d2bef5423adb88d0ac63899e88a9f0c4bbb370d3fb7b2fb5 \
            release --clean --timeout 60m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
