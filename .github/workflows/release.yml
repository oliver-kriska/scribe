# Release pipeline for scribe.
#
# Runs GoReleaser natively on an Apple Silicon macOS runner. Apple's toolchain
# builds and signs Darwin amd64/arm64; Zig cross-compiles Linux amd64/arm64.
# This avoids cross-platform Mach-O signing while still supporting the CGO +
# sqlite_fts5 build required by go-sqlite3.
#
# Triggered on tag push. Requires:
#   - HOMEBREW_TAP_GITHUB_TOKEN repo secret (PAT with repo:write on
#     oliver-kriska/homebrew-scribe)  — used by goreleaser to publish the
#     formula update.
#   - MACOS_SIGN_P12 + MACOS_SIGN_PASSWORD (Developer ID Application
#     certificate exported as base64 PKCS#12 and its password).
#   - MACOS_NOTARY_KEY + MACOS_NOTARY_KEY_ID + MACOS_NOTARY_ISSUER_ID
#     (raw or base64 App Store Connect .p8 key and its identifiers).

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # Manual trigger to backfill a release for an existing tag when the
    # automatic push trigger was suppressed (e.g. >3 tags pushed at once).
    # Run from main with the tag as input:
    #   gh workflow run release.yml --ref main -f tag=vX.Y.Z
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.7)"
        required: false
      dry_run:
        description: "Build, sign, notarize, and verify without publishing"
        type: boolean
        default: false

# Read-only at the top level (Scorecard Token-Permissions). The write
# scopes below are granted only to the one job that needs them.
permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    permissions:
      # GoReleaser creates the GitHub release and uploads the artifacts.
      contents: write
      # Keyless cosign signing: the OIDC token proves this workflow (not a
      # stolen key) produced the signature on checksums.txt.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Zig 0.15.2 (Linux CGO cross-compilers)
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install syft v1.51.0 (SBOM generation)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.0

      - name: Install cosign v2.6.0 (checksum signature)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # GoReleaser publishes separate .pem + .sig files. Cosign 3 requires
          # its new bundle output instead, so keep the compatible 2.x CLI.
          cosign-release: v2.6.0

      - name: Require a tag for a publishing dispatch
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "A tag is required unless dry_run is enabled." >&2
            exit 1
          fi

      - name: Ensure Rosetta can execute the Intel release
        run: |
          if ! arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true

      # Never silently publish unsigned macOS artifacts. The GoReleaser hook
      # also fails closed, but checking secrets here produces a clear error
      # before any build work starts.
      - name: Require Apple signing credentials
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          missing=()
          for name in \
            MACOS_SIGN_P12 \
            MACOS_SIGN_PASSWORD \
            MACOS_NOTARY_KEY \
            MACOS_NOTARY_KEY_ID \
            MACOS_NOTARY_ISSUER_ID
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required repository secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Import Developer ID identity into a temporary Keychain
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/scribe-signing.keychain-db"
          certificate="$RUNNER_TEMP/scribe-signing.p12"
          notary_key="$RUNNER_TEMP/AuthKey.p8"
          keychain_password=$(openssl rand -hex 24)

          printf '%s' "$MACOS_SIGN_P12" | openssl base64 -d -A >"$certificate"
          if [[ "$MACOS_NOTARY_KEY" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s' "$MACOS_NOTARY_KEY" >"$notary_key"
          else
            printf '%s' "$MACOS_NOTARY_KEY" | openssl base64 -d -A >"$notary_key"
          fi
          if ! grep -q 'BEGIN PRIVATE KEY' "$notary_key"; then
            echo "MACOS_NOTARY_KEY is neither raw nor base64-encoded .p8 content." >&2
            exit 1
          fi
          chmod 600 "$certificate" "$notary_key"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$MACOS_SIGN_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm -f "$certificate"

          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk '/"Developer ID Application:/{print $2; exit}')
          if [[ -z "$identity" ]]; then
            echo "Imported PKCS#12 contains no Developer ID Application identity." >&2
            exit 1
          fi
          echo "Imported Developer ID identity $identity"
          echo "MACOS_SIGN_IDENTITY=$identity" >>"$GITHUB_ENV"
          echo "MACOS_NOTARY_KEY_PATH=$notary_key" >>"$GITHUB_ENV"

      - name: Run GoReleaser 2.17.1
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: ${{ inputs.dry_run && 'release --snapshot --clean --skip=publish --timeout 60m' || 'release --clean --timeout 60m' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          MACOS_SIGN_TEAM_ID: AUL48LCR3Y
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      - name: Remove temporary Apple credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/scribe-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/scribe-signing.p12" "$RUNNER_TEMP/AuthKey.p8"
